# A protected Ingress (ADR 0022). Apply in the namespace the gateway watches
# after the ProtectionPolicy CRD is installed and the gateway runs with
# --kubernetes-protection-config. Without a policy (and with the default
# require_protection: true) the Ingress is withheld, not published.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders
spec:
  ingressClassName: hangang
  rules:
    - host: orders.example.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  name: http
---
apiVersion: world.hangang.dev/v1alpha1
kind: ProtectionPolicy
metadata:
  name: orders
spec:
  targetRefs:
    - group: networking.k8s.io
      kind: Ingress
      name: orders
  identity:
    profileRef:
      name: corp-sso
  authorization:
    pumgye:
      serviceId: orders
      resource: http:orders
      actions:
        - method: GET
          action: read
        - method: HEAD
          action: read
        - method: POST
          action: write
  network:
    enforcement: Required
---
# Namespace default: protects every other Ingress of this namespace that no
# policy targets. Identity and authorization only, no network claim.
apiVersion: world.hangang.dev/v1alpha1
kind: ProtectionPolicy
metadata:
  name: namespace-default
spec:
  namespaceDefault: true
  identity:
    profileRef:
      name: corp-sso
  authorization:
    pumgye:
      serviceId: internal-tools
      resource: http:internal-tools
      actions:
        - method: GET
          action: read
  network:
    enforcement: None
---
# Explicitly public: an identity portal's sign-in, callback and health paths.
# Reported as `public` (not `unprotected`); any other path on this Ingress, or
# a defaultBackend, withholds it (PublicPathNotAllowed).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-portal
spec:
  ingressClassName: hangang
  rules:
    - host: auth.example.test
      http:
        paths:
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: hopae
                port:
                  name: portal
          - path: /callback
            pathType: Prefix
            backend:
              service:
                name: hopae
                port:
                  name: portal
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: hopae
                port:
                  name: portal
---
apiVersion: world.hangang.dev/v1alpha1
kind: ProtectionPolicy
metadata:
  name: auth-portal-public
spec:
  access: Public
  targetRefs:
    - group: networking.k8s.io
      kind: Ingress
      name: auth-portal
  public:
    reason: Hopae sign-in portal (login, provider callbacks, health)
    paths: ["/login/*", "/callback/*", "/healthz"]
