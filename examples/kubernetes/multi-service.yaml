apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: echo
          image: mendhak/http-https-echo:42@sha256:a265f55c86cb3baead76fdf379dc8e9e6440ed121874e101e60b833e05bce8d4
          env:
            - {name: HTTP_PORT, value: "5678"}
            - {name: DISABLE_REQUEST_LOGS, value: "true"}
            - {name: LOG_IGNORE_PATH, value: ".*"}
            - {name: NODE_OPTIONS, value: "--max-old-space-size=128"}
          ports:
            - {name: http, containerPort: 5678}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: demo
spec:
  type: ClusterIP
  selector: {app: echo}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-b
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: echo-b}
  template:
    metadata:
      labels: {app: echo-b}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: echo-b
          image: mendhak/http-https-echo:42@sha256:a265f55c86cb3baead76fdf379dc8e9e6440ed121874e101e60b833e05bce8d4
          env:
            - {name: HTTP_PORT, value: "5678"}
            - {name: DISABLE_REQUEST_LOGS, value: "true"}
            - {name: LOG_IGNORE_PATH, value: ".*"}
            - {name: NODE_OPTIONS, value: "--max-old-space-size=128"}
          ports:
            - {name: http, containerPort: 5678}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: echo-b
  namespace: demo
spec:
  type: ClusterIP
  selector: {app: echo-b}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: echo-apps, namespace: demo}
spec:
  ingressClassName: hangang
  rules:
    - host: echo.example.test
      http:
        paths:
          - path: /second
            pathType: Prefix
            backend:
              service: {name: echo-b, port: {number: 80}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: echo, port: {number: 80}}
    - host: echo-b.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: echo-b, port: {number: 80}}
