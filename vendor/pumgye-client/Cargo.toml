[package]
name = "pumgye-client"
version = "0.1.9"
edition = "2024"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
pumgye-protocol = { git = "https://github.com/ziozzang/pumgye", rev = "98ecfcd5f319c203b35d2e37aee9ce95a040d874" }
anyhow = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1.15", features = ["std"] }

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
