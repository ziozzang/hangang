name: Native binary qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'deny.toml'
      - 'Makefile'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.*'
      - 'build.rs'
      - 'tools/prepare_release.py'
      - '.github/workflows/binaries.yml'
  pull_request:
    paths:
      - 'deny.toml'
      - 'Makefile'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.*'
      - 'build.rs'
      - 'tools/prepare_release.py'
      - '.github/workflows/binaries.yml'

permissions:
  contents: read

concurrency:
  group: native-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-check:
    # The native matrix below runs only a few test targets per platform. This
    # one Linux job runs formatting, clippy on every target and the complete
    # Rust test suite so integration tests under tests/ catch regressions.
    name: fmt, clippy and full test suite (x86_64 Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Use physical temporary paths
        run: python3 -c 'import os,tempfile; print("TMPDIR=" + os.path.realpath(tempfile.gettempdir()))' >> "$GITHUB_ENV"
      - name: Formatting and clippy on all targets
        run: make check
      - name: Complete Rust test suite
        # Tests that need Docker or other external services stay #[ignore].
        run: cargo test --locked

  supply-chain:
    # Licenses, RustSEC advisories, dependency sources and duplicates. The
    # accepted advisory list lives in deny.toml; cargo-audit reads the same IDs.
    name: dependency licenses and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.18.9,cargo-audit@0.22.2
      - name: cargo deny
        run: cargo deny --locked check advisories bans licenses sources
      - name: cargo audit
        shell: bash
        run: |
          ignores=()
          for id in $(grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4}' deny.toml | sort -u); do
            ignores+=(--ignore "$id")
          done
          cargo audit --deny warnings "${ignores[@]}"

  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            gateway_args: --allow-unsandboxed-lua
          - runner: macos-15
            target: aarch64-apple-darwin
            gateway_args: --allow-unsandboxed-lua
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      HANGANG_TEST_GATEWAY_ARGS: ${{ matrix.gateway_args || '' }}
      HANGANG_BINARY: target/${{ matrix.target }}/release/hangang
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add '${{ matrix.target }}'
      - name: Install musl build tools
        if: contains(matrix.target, '-musl')
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: Use physical temporary paths
        shell: bash
        run: python3 -c 'import os,tempfile; print("TMPDIR=" + os.path.realpath(tempfile.gettempdir()))' >> "$GITHUB_ENV"
      - name: Library tests and CLI capability boundaries
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo test --locked --lib --test cli_about --test ingress_host --target '${{ matrix.target }}'
      - name: Build native release binaries
        run: cargo build --locked --release --bins --target '${{ matrix.target }}'
      - name: Gateway smoke tests
        run: python3 tests/smoke.py
      - name: UDP lifecycle smoke tests
        run: python3 tests/udp_smoke.py
      - name: Linux supervised handoff and Lua isolation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tests/restart_smoke.py
          "$HANGANG_BINARY" --lua-sandbox-check
      - name: CLI identity
        shell: bash
        run: |
          "$HANGANG_BINARY" --about
          "$HANGANG_BINARY" --version
      - name: Prepare unsigned qualification assets
        run: python3 tools/prepare_release.py --unsigned --target '${{ matrix.target }}' --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hangang-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
