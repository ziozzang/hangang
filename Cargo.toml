[package]
name = "hangang"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Jioh Jung <ziozzang@users.noreply.github.com>"]
description = "A dynamically configured asynchronous L4/L7 reverse proxy"

[dependencies]
anyhow = "1"
async-trait = "0.1"
arc-swap = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
ipnet = { version = "2", features = ["serde"] }
mlua = { version = "0.11", features = ["lua54", "vendored", "send", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
rsa = "0.9"
quick-xml = "0.41"
memchr = "2"
maxminddb = { version = "0.32.0", default-features = false }
tokio = { version = "1", features = ["full"] }
regex = { version = "1.12", default-features = false, features = ["std", "perf"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
tower-service = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"

tempfile = "3"
libc = "0.2"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "tls12", "webpki-tokio"] }
webpki-roots = "1"
rustls-pemfile = "2"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
sha1_smol = "1"
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
redis = { version = "1", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager", "script"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "rcgen"] }
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = "0.14"
rand = "0.8"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
