[package]
name = "hangang-decision-exporter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Independent bounded exporter and local store for hangang.decision.v1 events"

[[bin]]
name = "hangang-decision-exporter"
path = "src/main.rs"

[dependencies]
hangang-decision-event = { path = "../hangang-decision-event" }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "signal", "macros", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
